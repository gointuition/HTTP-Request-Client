name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Third-party sources (BoringSSL, brotli, jansson, zstd, ...) are cloned by
      # CMake at the pinned revisions declared in CMakeLists.txt. Cache them keyed
      # on that file so bumping a pin invalidates the cache; a valid cached
      # checkout is reused as-is by clone_third_party_pinned().
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      # Test executables validate basket JSON internally via jansson and exit
      # non-zero on failure. Logs are still captured for inspection via artifacts.
      - name: Smoke test — GET
        shell: bash
        working-directory: bin
        run: |
          set -o pipefail
          ./test_GET 2>&1 | tee test_GET.log

      - name: Smoke test — POST
        shell: bash
        working-directory: bin
        run: |
          set -o pipefail
          ./test_POST 2>&1 | tee test_POST.log

      # Surface the built artifacts for quick inspection on failures.
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: bin/*.log
          if-no-files-found: ignore

      # ================================================================
      # Language bindings (test.py / test.js / Test.java)
      # Every binding test exits non-zero on failure (sys.exit(1) /
      # process.exit(1) / System.exit(1)), so the step itself captures
      # pass/fail.  Output is additionally captured as a log artifact
      # for post-mortem inspection.
      # ================================================================

      # Python binding (cffi ABI mode — loads the shared library directly,
      # no C compiler needed).  build.sh installs cffi and runs test.py.
      # See python/README.md.
      - name: Python — run test.py
        id: py_test
        shell: bash
        run: |
          set -o pipefail
          cd "${{ github.workspace }}"
          bash python/build.sh 2>&1 | tee python_test.log
          echo "---"
          if grep -q "All tests passed" python_test.log; then
            echo "::notice:: Python test PASSED"
          fi

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log-${{ matrix.os }}
          path: python_test.log
          if-no-files-found: ignore

      # Java binding (JNI bridge; builds a fat JAR linking http2client + JNI
      # bridge, then runs Test.java from the JAR).  See java/build.sh.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java — build and run Test.java
        id: java_test
        shell: bash
        run: |
          set -o pipefail
          cd "${{ github.workspace }}/java"
          bash build.sh 2>&1 | tee "${{ github.workspace }}/java_test.log"
          echo "---"
          if grep -q "All tests passed" "${{ github.workspace }}/java_test.log"; then
            echo "::notice:: Java test PASSED"
          fi

      - name: Upload Java test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-log-${{ matrix.os }}
          path: java_test.log
          if-no-files-found: ignore

      # Node.js binding (N-API native addon via node-gyp).
      # build.sh runs npm install + build; test.js runs via node.
      # See nodejs/README.MD.
      - name: Node.js — build and run test.js
        id: node_test
        shell: bash
        run: |
          set -o pipefail
          cd "${{ github.workspace }}/nodejs"
          bash build.sh
          node test.js 2>&1 | tee "${{ github.workspace }}/nodejs_test.log"
          echo "---"
          if grep -q "All tests passed" "${{ github.workspace }}/nodejs_test.log"; then
            echo "::notice:: Node.js test PASSED"
          fi

      - name: Upload Node.js test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-test-log-${{ matrix.os }}
          path: nodejs_test.log
          if-no-files-found: ignore

  # Windows builds use MSYS2 / MinGW-w64 (native MSVC is not supported).
  # See README.md "Windows (MSYS2 / MinGW-w64)" for the toolchain setup.
  build-and-test-windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        # All shell steps run inside the MSYS2 MINGW64 environment.
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        id: msys2_setup
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python-pip
            unzip
            git

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-Windows-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Smoke test — GET
        working-directory: bin
        run: |
          set -o pipefail
          ./test_GET 2>&1 | tee test_GET.log

      - name: Smoke test — POST
        working-directory: bin
        run: |
          set -o pipefail
          ./test_POST 2>&1 | tee test_POST.log

      - name: Upload C test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows-latest
          path: bin/*.log
          if-no-files-found: ignore

      # ================================================================
      # Language bindings (test.py / test.js / Test.java) — Windows
      # ================================================================

      # Python: cffi already handles Windows (http2_client.py detects the
      # platform and uses libhttp2client.dll).  build.sh installs cffi via
      # MSYS2 pip (mingw-w64-x86_64-python-pip package).
      - name: Python — run test.py (Windows)
        id: py_test_win
        shell: msys2 {0}
        run: |
          set -o pipefail
          cd "${{ github.workspace }}"
          bash python/build.sh 2>&1 | tee python_test.log
          echo "---"
          if grep -q "All tests passed" python_test.log; then
            echo "::notice:: Python test PASSED"
          fi

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log-windows-latest
          path: python_test.log
          if-no-files-found: ignore

      # Java: build.sh already handles MSYS2 (resolves JAVA_HOME, requires
      # gcc).  setup-java provides a JDK.  Maven is downloaded inside the
      # MSYS2 step (its GITHUB_PATH entry isn't inherited by MSYS2 shell).
      # The JNI bridge is compiled with gcc (-Djni.compiler=gcc) to match
      # the MinGW-built libhttp2client.dll.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java — build and run Test.java (Windows)
        id: java_test_win
        shell: msys2 {0}
        run: |
          set -o pipefail
          # setup-java sets JAVA_HOME as a Windows path; convert to Unix
          # form so it works inside MSYS2 regardless of path-conversion
          # settings.
          if [ -n "$JAVA_HOME" ]; then
            export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version
          # Maven: MSYS2 does not inherit GITHUB_PATH; download the binary
          # inside the MSYS2 context so mvn is on PATH.
          MAVEN_VERSION=3.9.9
          curl -fsSLO "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.zip"
          unzip -qo "apache-maven-${MAVEN_VERSION}-bin.zip" -d /tmp
          export PATH="/tmp/apache-maven-${MAVEN_VERSION}/bin:$PATH"
          mvn --version
          # NOTE: MSYS2_ARG_CONV_EXCL is set inside build.sh right before
          # the mvn clean package call (per java/README.md).  Do NOT set it
          # here — it would also disable conversion for Maven's own shell
          # launcher and break classpath resolution.
          cd "${{ github.workspace }}/java"
          bash build.sh 2>&1 | tee "${{ github.workspace }}/java_test.log"
          echo "---"
          if grep -q "All tests passed" "${{ github.workspace }}/java_test.log"; then
            echo "::notice:: Java test PASSED"
          fi

      - name: Upload Java test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-log-windows-latest
          path: java_test.log
          if-no-files-found: ignore

      # Node.js: the split toolchain on Windows requires MSVC for the
      # addon (node-gyp's default on win32) while gendef (from MSYS2) is
      # needed to generate the import library.  Run from pwsh so that
      # node-gyp can find VS natively; add the MSYS2 MINGW64 bin directory
      # to PATH for gendef.
      # windows-latest ships VS 2026 (v18) whose MSVC toolset (14.5x) is
      # not yet in node-gyp's version map.  We patch find-visualstudio.js
      # after dependencies are installed and before the addon is built.
      # See nodejs/README.MD.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Node.js — build and run test.js (Windows)
        id: node_test_win
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Add MSYS2 MINGW64 bin to PATH (for build-addon.js → gendef).
          # Use the installer's output to locate the exact MSYS2 root.
          $mingwBin = Join-Path "${{ steps.msys2_setup.outputs.msys2-location }}" "mingw64\bin"
          Write-Host "::debug:: Adding $mingwBin to PATH"
          if (Test-Path $mingwBin) {
            $env:Path = "$mingwBin;$env:Path"
          } else {
            Write-Host "::warning:: MSYS2 MINGW64 bin not found at $mingwBin"
          }
          Set-Location "${{ github.workspace }}\nodejs"

          # Install dependencies without triggering the "install" script
          # (which runs build-addon.js → node-gyp rebuild).  We need to
          # patch node-gyp first.
          npm install --ignore-scripts
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error:: npm install --ignore-scripts failed"
            exit $LASTEXITCODE
          }

          # VS 2026 ships MSVC 14.5x and has installation version 18.x.
          # node-gyp 10.x's getVersionInfo() only maps versionMajor
          # 15/16/17 to 2017/2019/2022; versionMajor 18 → returns {},
          # causing "unknown version 'undefined'".  Insert 18 → 2026
          # mapping before the unsupported-version bail-out.
          $findVS = "node_modules\node-gyp\lib\find-visualstudio.js"
          if (Test-Path $findVS) {
            $content = Get-Content $findVS -Raw
            $marker = "if (ret.versionMajor === 17) {`n    ret.versionYear = 2022`n    return ret`n  }"
            $newBlock = "if (ret.versionMajor === 18) {`n    ret.versionYear = 2026`n    return ret`n  }`n  "
            if ($content -match [regex]::Escape($marker) -and $content -notmatch 'versionMajor === 18.*2026') {
              $patched = $content -replace [regex]::Escape($marker), "$marker`n  $newBlock"
              Set-Content $findVS $patched -NoNewline
              Write-Host "::notice:: Patched node-gyp: added versionMajor 18 → VS 2026"
            } elseif ($content -match 'versionMajor === 18.*2026') {
              Write-Host "::notice:: node-gyp already patched for VS 2026"
            } else {
              Write-Host "::warning:: Patch marker not found; node-gyp may have changed"
            }
          }

          # Now run the full build (gendef + lib.exe + node-gyp rebuild + copy DLLs)
          node build-addon.js
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error:: build-addon.js failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          node test.js 2>&1 | Tee-Object -FilePath "${{ github.workspace }}\nodejs_test.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content "${{ github.workspace }}\nodejs_test.log" -Raw
          if ($log -match "All tests passed") {
            Write-Host "::notice:: Node.js test PASSED"
          }

      - name: Upload Node.js test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-test-log-windows-latest
          path: nodejs_test.log
          if-no-files-found: ignore
