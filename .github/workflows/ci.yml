name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # Linux — builds inside the manylinux_2_28 container so the produced
  # shared library / wheel stays ABI-compatible with glibc >= 2.28
  # (the oldest distro this project targets).
  # ================================================================
  build-linux:
    name: linux
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # IMPORTANT (containers): inside a container job, the runner's default
      # working directory and the `${{ github.workspace }}` context resolve to
      # the HOST path (/home/runner/work/...), which does NOT exist inside the
      # container. The workspace is actually mounted at /__w/<repo>/<repo> and
      # is exported as the $GITHUB_WORKSPACE environment variable. So this job
      # uses $GITHUB_WORKSPACE explicitly instead of relative `working-directory`
      # or ${{ github.workspace }}.
      - name: Show workspace path
        run: echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE pwd=$(pwd)"

      # The manylinux_2_28 container is AlmaLinux 8 based. It ships a full
      # gcc/make/git toolchain but only CMake 3.20 (AppStream), while this
      # project requires CMake >= 3.29 (see CMakeLists.txt). So install the
      # assembler (nasm) and ccache via dnf, then pull a modern CMake + Ninja
      # from PyPI (the `cmake`/`ninja` wheels bundle recent binaries).
      #
      # NOTE: the container's default /usr/bin/python3 has NO pip. Use one of
      # the bundled Pythons under /opt/python (each ships its own pip). The
      # exact directory name varies across manylinux releases, so resolve it
      # dynamically at runtime instead of hardcoding, then prepend its bin/ to
      # PATH and use the full interpreter path for pip.
      - name: Install build tools
        run: |
          set -euxo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            nasm ccache make gcc gcc-c++ git unzip
          # Resolve a bundled manylinux Python (prefer the newest 3.11+).
          MANYLINUX_PY="$(ls -1d /opt/python/cp3*/bin/python3 2>/dev/null | sort -V | tail -1)"
          [ -n "$MANYLINUX_PY" ] || { echo "::error:: no /opt/python interpreter found"; exit 1; }
          echo "Using bundled Python: $MANYLINUX_PY"
          PY_BIN_DIR="$(dirname "$MANYLINUX_PY")"
          echo "$PY_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$PY_BIN_DIR:$PATH"
          "$MANYLINUX_PY" -m pip install --upgrade pip
          "$MANYLINUX_PY" -m pip install cmake ninja
          python3 --version
          cmake --version
          ninja --version
          ccache --version

      # Third-party sources (BoringSSL, brotli, jansson, zstd, ...) are cloned by
      # CMake at the pinned revisions declared in CMakeLists.txt. Cache them keyed
      # on that file so bumping a pin invalidates the cache; a valid cached
      # checkout is reused as-is by clone_third_party_pinned().
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-Linux-${{ hashFiles('CMakeLists.txt') }}

      # ccache caches compiler outputs by hashing inputs, so re-running the
      # pipeline (or bumping a dependency) skips recompiling unchanged .o files
      # — including the heavy third-party libraries (BoringSSL, etc.).
      # Cache paths are RELATIVE: inside a container job the actions resolve
      # them against the container's $GITHUB_WORKSPACE (the /__w mount), whereas
      # the `${{ github.workspace }}` context points at the non-existent host
      # path. Relative paths keep the cache in the right place on every runner.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-Linux-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-Linux-${{ hashFiles('CMakeLists.txt') }}-
            ccache-Linux-

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-Linux-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-Linux-${{ hashFiles('CMakeLists.txt') }}-
            build-Linux-

      - name: Configure
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          cmake --build build --parallel 4
          echo "---- ccache stats ----"
          ccache -s

      # Smoke tests: run the C test executables. Each validates its basket JSON
      # internally via jansson and exits non-zero on failure. These tests make
      # live requests to httpbin.org; only the stable GET/POST smoke tests are
      # run in CI (the other verb/concurrency tests are flaky over the network).
      - name: Smoke test — GET
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/bin"
          ./test_GET 2>&1 | tee test_GET.log

      - name: Smoke test — POST
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/bin"
          ./test_POST 2>&1 | tee test_POST.log

      # Surface the built artifacts for quick inspection on failures.
      - name: Upload C test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-ubuntu-latest
          path: bin/*.log
          if-no-files-found: ignore

      # ================================================================
      # Language bindings (test.py / test.js / Test.java)
      # Every binding test exits non-zero on failure, so the step itself
      # captures pass/fail. Output is captured as a log artifact.
      # ================================================================

      # Python binding (cffi ABI mode — loads the shared library directly).
      - name: Python — run test.py
        id: py_test
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          bash python/build.sh 2>&1 | tee python_test.log
          echo "---"
          if grep -q "All tests passed" python_test.log; then
            echo "::notice:: Python test PASSED"
          fi

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log-ubuntu-latest
          path: python_test.log
          if-no-files-found: ignore

      # Java binding (JNI bridge; builds a fat JAR linking http2client + JNI
      # bridge, then runs Test.java from the JAR).  See java/build.sh.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java — build and run Test.java
        id: java_test
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/java"
          bash build.sh 2>&1 | tee "$GITHUB_WORKSPACE/java_test.log"
          echo "---"
          if grep -q "All tests passed" "$GITHUB_WORKSPACE/java_test.log"; then
            echo "::notice:: Java test PASSED"
          fi

      - name: Upload Java test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-log-ubuntu-latest
          path: java_test.log
          if-no-files-found: ignore

      # Node.js binding (N-API native addon via node-gyp).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node.js — build and run test.js
        id: node_test
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/nodejs"
          bash build.sh
          node test.js 2>&1 | tee "$GITHUB_WORKSPACE/nodejs_test.log"
          echo "---"
          if grep -q "All tests passed" "$GITHUB_WORKSPACE/nodejs_test.log"; then
            echo "::notice:: Node.js test PASSED"
          fi

      # `npm install` (run by build.sh) re-injects gypfile:true and an install
      # script into nodejs/package.json. Restore the pristine git version so the
      # published package does not force consumers to compile from source.
      - name: Restore pristine nodejs/package.json
        shell: bash
        run: git checkout -- nodejs/package.json

      - name: Upload Node.js test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-test-log-ubuntu-latest
          path: nodejs_test.log
          if-no-files-found: ignore

      # Publish the compiled shared library + public headers so downstream
      # consumers (and the release job) can fetch them without rebuilding.
      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-http2client-ubuntu-latest
          path: |
            lib/shared/*
            include/*.h
          if-no-files-found: error

      - name: Upload Node.js addon
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-addon-ubuntu-latest
          path: nodejs
          if-no-files-found: error

      - name: Upload Python binding
        uses: actions/upload-artifact@v4
        with:
          name: python-binding-ubuntu-latest
          path: python
          if-no-files-found: error

      # Build a manylinux_2_28 wheel (matches the container's glibc). The native
      # lib is copied into python/lib/ and shipped inside the wheel via
      # package_data, so each OS/arch produces its own self-contained .whl.
      #
      # Use the container's bundled Python (cp311 under /opt/python, selected
      # and put on PATH by the "Install build tools" step) rather than
      # actions/setup-python, so the wheel is built with a real manylinux
      # interpreter.
      - name: Build Python wheel
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/python"
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install --quiet build cffi wheel
          mkdir -p lib
          cp "$GITHUB_WORKSPACE/lib/shared/libhttp2client.so" "lib/libhttp2client.so"
          python3 setup.py bdist_wheel --plat-name="manylinux_2_28_x86_64" --dist-dir dist
          ls -1 dist

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-ubuntu-latest
          path: python/dist/*.whl
          if-no-files-found: error

      - name: Upload Java JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-jar-ubuntu-latest
          path: java/build/*.jar
          if-no-files-found: error

  # ================================================================
  # macOS
  # ================================================================
  build-macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Third-party sources are cloned by CMake at pinned revisions; cache them
      # keyed on CMakeLists.txt so a valid cached checkout is reused.
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-macOS-${{ hashFiles('CMakeLists.txt') }}

      - name: Install ccache
        run: |
          brew install ccache
          ccache --version
          ccache --zero-stats || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macOS-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-macOS-${{ hashFiles('CMakeLists.txt') }}-
            ccache-macOS-

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-macOS-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-macOS-${{ hashFiles('CMakeLists.txt') }}-
            build-macOS-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake --build build --parallel 4
          echo "---- ccache stats ----"
          ccache -s

      # Run the full C test suite. Each executable validates its basket JSON
      # internally via jansson and exits non-zero on failure.
      # Smoke tests: run the C test executables. Each validates its basket JSON
      # internally via jansson and exits non-zero on failure. These tests make
      # live requests to httpbin.org; only the stable GET/POST smoke tests are
      # run in CI (the other verb/concurrency tests are flaky over the network).
      - name: Smoke test — GET
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/bin"
          ./test_GET 2>&1 | tee test_GET.log

      - name: Smoke test — POST
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/bin"
          ./test_POST 2>&1 | tee test_POST.log

      - name: Upload C test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos-latest
          path: bin/*.log
          if-no-files-found: ignore

      # ================================================================
      # Language bindings (test.py / test.js / Test.java)
      # ================================================================

      # Python binding (cffi ABI mode — loads the shared library directly).
      - name: Python — run test.py
        id: py_test
        shell: bash
        run: |
          set -o pipefail
          cd "${{ github.workspace }}"
          bash python/build.sh 2>&1 | tee python_test.log
          echo "---"
          if grep -q "All tests passed" python_test.log; then
            echo "::notice:: Python test PASSED"
          fi

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log-macos-latest
          path: python_test.log
          if-no-files-found: ignore

      # Java binding (JNI bridge; builds a fat JAR linking http2client + JNI
      # bridge, then runs Test.java from the JAR).  See java/build.sh.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java — build and run Test.java
        id: java_test
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/java"
          bash build.sh 2>&1 | tee "$GITHUB_WORKSPACE/java_test.log"
          echo "---"
          if grep -q "All tests passed" "$GITHUB_WORKSPACE/java_test.log"; then
            echo "::notice:: Java test PASSED"
          fi

      - name: Upload Java test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-log-macos-latest
          path: java_test.log
          if-no-files-found: ignore

      # Node.js binding (N-API native addon via node-gyp).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node.js — build and run test.js
        id: node_test
        shell: bash
        run: |
          set -o pipefail
          cd "${{ github.workspace }}/nodejs"
          bash build.sh
          node test.js 2>&1 | tee "${{ github.workspace }}/nodejs_test.log"
          echo "---"
          if grep -q "All tests passed" "${{ github.workspace }}/nodejs_test.log"; then
            echo "::notice:: Node.js test PASSED"
          fi

      - name: Restore pristine nodejs/package.json
        shell: bash
        run: git checkout -- nodejs/package.json

      - name: Upload Node.js test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-test-log-macos-latest
          path: nodejs_test.log
          if-no-files-found: ignore

      # Publish the compiled shared library + public headers for the release job.
      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-http2client-macos-latest
          path: |
            lib/shared/*
            include/*.h
          if-no-files-found: error

      - name: Upload Node.js addon
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-addon-macos-latest
          path: nodejs
          if-no-files-found: error

      - name: Upload Python binding
        uses: actions/upload-artifact@v4
        with:
          name: python-binding-macos-latest
          path: python
          if-no-files-found: error

      # Build a platform-specific wheel (standard cross-platform Python packaging).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python wheel
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/python"
          python3 -m pip install --quiet build cffi wheel
          mkdir -p lib
          cp "${{ github.workspace }}/lib/shared/libhttp2client.dylib" "lib/libhttp2client.dylib"
          python3 setup.py bdist_wheel --plat-name="macosx_11_0_x86_64" --dist-dir dist
          ls -1 dist

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-macos-latest
          path: python/dist/*.whl
          if-no-files-found: error

      - name: Upload Java JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-jar-macos-latest
          path: java/build/*.jar
          if-no-files-found: error

  # ================================================================
  # Windows — uses MSYS2 / MinGW-w64 (native MSVC is not supported).
  # See README.md "Windows (MSYS2 / MinGW-w64)" for the toolchain setup.
  # ================================================================
  build-windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        # All shell steps run inside the MSYS2 MINGW64 environment.
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        id: msys2_setup
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-tools-git
            unzip
            git

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-Windows-${{ hashFiles('CMakeLists.txt') }}

      # ccache caches compiler outputs by input hash, skipping recompilation of
      # unchanged objects (incl. the heavy third-party libraries). Persist the
      # cache across runs via actions/cache.
      #
      # IMPORTANT (MSYS2): ccache runs inside the MSYS2 shell, where `~` resolves
      # to /home/runner, NOT the Windows C:\Users\runner that actions/cache uses.
      # We therefore use an explicit workspace-relative path for BOTH the cache
      # store and CCACHE_DIR so they always match.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-Windows-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-Windows-${{ hashFiles('CMakeLists.txt') }}-
            ccache-Windows-

      # CRITICAL: without caching build/, the restored third_party sources have no
      # matching object/library files, so Ninja recompiles BoringSSL (and every
      # other third party) from scratch every run.
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-Windows-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-Windows-${{ hashFiles('CMakeLists.txt') }}-
            build-Windows-

      - name: Configure
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export PATH="/mingw64/bin:$PATH"
          ccache -M 1G
          ccache -z
          ccache -p | head -1
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export PATH="/mingw64/bin:$PATH"
          cmake --build build --parallel $(nproc)
          echo "---- ccache stats ----"
          ccache -s

      # Run the full C test suite. Each executable validates its basket JSON
      # internally via jansson and exits non-zero on failure.
      # Smoke tests: run the C test executables. Each validates its basket JSON
      # internally via jansson and exits non-zero on failure. These tests make
      # live requests to httpbin.org; only the stable GET/POST smoke tests are
      # run in CI (the other verb/concurrency tests are flaky over the network).
      - name: Smoke test — GET
        working-directory: bin
        run: |
          set -o pipefail
          ./test_GET 2>&1 | tee test_GET.log

      - name: Smoke test — POST
        working-directory: bin
        run: |
          set -o pipefail
          ./test_POST 2>&1 | tee test_POST.log

      - name: Upload C test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows-latest
          path: bin/*.log
          if-no-files-found: ignore

      # ================================================================
      # Language bindings (test.py / test.js / Test.java) — Windows
      # ================================================================

      # Python: cffi already handles Windows (http2_client.py detects the
      # platform and uses libhttp2client.dll).  build.sh installs cffi via
      # MSYS2 pip (mingw-w64-x86_64-python-pip package).
      - name: Python — run test.py (Windows)
        id: py_test_win
        shell: msys2 {0}
        run: |
          set -o pipefail
          cd "${{ github.workspace }}"
          bash python/build.sh 2>&1 | tee python_test.log
          echo "---"
          if grep -q "All tests passed" python_test.log; then
            echo "::notice:: Python test PASSED"
          fi

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log-windows-latest
          path: python_test.log
          if-no-files-found: ignore

      # Java: build.sh already handles MSYS2 (resolves JAVA_HOME, requires
      # gcc).  setup-java provides a JDK.  Maven is downloaded inside the
      # MSYS2 step (its GITHUB_PATH entry isn't inherited by MSYS2 shell).
      # The JNI bridge is compiled with gcc (-Djni.compiler=gcc) to match
      # the MinGW-built libhttp2client.dll.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java — build and run Test.java (Windows)
        id: java_test_win
        shell: msys2 {0}
        run: |
          set -o pipefail
          # setup-java sets JAVA_HOME as a Windows path; convert to Unix
          # form so it works inside MSYS2 regardless of path-conversion
          # settings.
          if [ -n "$JAVA_HOME" ]; then
            export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version
          # Maven: MSYS2 does not inherit GITHUB_PATH; download the binary
          # inside the MSYS2 context so mvn is on PATH.
          MAVEN_VERSION=3.9.9
          curl -fsSLO "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.zip"
          unzip -qo "apache-maven-${MAVEN_VERSION}-bin.zip" -d /tmp
          export PATH="/tmp/apache-maven-${MAVEN_VERSION}/bin:$PATH"
          mvn --version
          # NOTE: MSYS2_ARG_CONV_EXCL is set inside build.sh right before
          # the mvn clean package call (per java/README.md).  Do NOT set it
          # here — it would also disable conversion for Maven's own shell
          # launcher and break classpath resolution.
          cd "${{ github.workspace }}/java"
          bash build.sh 2>&1 | tee "${{ github.workspace }}/java_test.log"
          echo "---"
          if grep -q "All tests passed" "${{ github.workspace }}/java_test.log"; then
            echo "::notice:: Java test PASSED"
          fi

      - name: Upload Java test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-log-windows-latest
          path: java_test.log
          if-no-files-found: ignore

      # Node.js: Windows uses a split toolchain (see nodejs/README.MD
      # "Windows (MSVC + MinGW dual-toolchain)").  The C library
      # (libhttp2client.dll) is already built by MinGW above; the addon is
      # compiled with MSVC via node-gyp.  build-addon.js generates the MSVC
      # import library (http2client.lib) from the DLL using gendef (MSYS2)
      # + lib.exe (MSVC), then runs node-gyp rebuild, and finally copies
      # libhttp2client.dll + MinGW runtime DLLs next to the addon.
      #
      # We run from PowerShell (not MSYS2) so node-gyp's MSVC auto-detection
      # works out of the box (windows-latest ships VS 2022).  The MSYS2
      # mingw64\bin is prepended to PATH only to expose gendef.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache npm deps + node-gyp's downloaded Node headers so re-runs skip the
      # (slow) npm install and header fetch. Keyed on package-lock.json so a dep
      # change forces a refresh.
      - name: Cache Node.js dependencies (Windows)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/nodejs/node_modules
            ~\AppData\Local\node-gyp\Cache
            ~\node-gyp
          key: node-deps-windows-${{ hashFiles('nodejs/package-lock.json') }}
          restore-keys: |
            node-deps-windows-

      - name: Node.js — build and run test.js (Windows)
        id: node_test_win
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Prepend MSYS2 mingw64\bin so gendef (from mingw-w64-x86_64-tools-git)
          # is discoverable; keep the rest of PATH (SystemFiles, VS, ...) intact.
          $env:PATH = "${{ steps.msys2_setup.outputs.msys2-location }}\mingw64\bin;" + $env:PATH
          Set-Location "${{ github.workspace }}\nodejs"
          # Verify gendef is reachable (the import-lib step needs it).
          where.exe gendef

          # node-gyp's PowerShell-based VS detection is broken on this runner
          # (its PowerShell spawn crashes with ERR_CHILD_PROCESS_STDIO_MAXB and
          # it mis-parses the VS 18 install as "unknown version undefined").
          # Workaround: set VCINSTALLDIR + VSCMD_VER + WindowsSDKVersion to make
          # node-gyp's non-PowerShell path (findVSFromSpecifiedLocation) succeed.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsInstall) {
            Write-Error "Visual Studio with VC tools not found via vswhere"
            exit 1
          }
          $env:VCINSTALLDIR = "$vsInstall\VC\"
          # Pretend it is VS 2022 (17.x) so node-gyp accepts the version. The
          # MSVC toolset is ABI-compatible across VS 2022/18 for our purposes.
          $env:VSCMD_VER = "17.0.0"
          # Pick the latest Windows SDK installed (node-gyp needs one to link).
          $sdkDir = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1).Name
          if ($sdkDir) { $env:WindowsSDKVersion = "$sdkDir\" }
          Write-Output "Using VS: $vsInstall"
          Write-Output "VCINSTALLDIR=$env:VCINSTALLDIR VSCMD_VER=$env:VSCMD_VER WindowsSDKVersion=$env:WindowsSDKVersion"

          # Install deps WITHOUT running the install script, then build
          # explicitly so a build failure aborts before test.js runs.
          npm install --ignore-scripts
          # build-addon.js: generates http2client.lib (gendef + lib.exe),
          # runs node-gyp rebuild (MSVC), copies runtime DLLs next to addon.
          npm run build
          if ($LASTEXITCODE -ne 0) { Write-Error "addon build failed"; exit 1 }
          node test.js 2>&1 | Tee-Object -FilePath "${{ github.workspace }}\nodejs_test.log"
          if ($LASTEXITCODE -ne 0) { Write-Error "test.js failed"; exit 1 }
          Write-Output "---"
          if (Select-String -Path "${{ github.workspace }}\nodejs_test.log" -Pattern "All tests passed" -Quiet) {
            Write-Output "::notice:: Node.js test PASSED"
          } else {
            Write-Error "Node.js test did not report success"
            exit 1
          }

      - name: Upload Node.js test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-test-log-windows-latest
          path: nodejs_test.log
          if-no-files-found: ignore

      # Same as the non-Windows job: npm install re-injects gypfile:true and an
      # install script into nodejs/package.json. Restore the pristine git version.
      - name: Restore pristine nodejs/package.json
        shell: bash
        run: git checkout -- nodejs/package.json

      # Publish the compiled shared library (libhttp2client.dll, staged next to
      # the test/Node addon) + public headers for the release job.
      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-http2client-windows-latest
          path: |
            lib/shared/*
            include/*.h
          if-no-files-found: error

      - name: Upload Node.js addon
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-addon-windows-latest
          path: nodejs
          if-no-files-found: error

      - name: Upload Python binding
        uses: actions/upload-artifact@v4
        with:
          name: python-binding-windows-latest
          path: python
          if-no-files-found: error

      # Build a platform-specific wheel (standard cross-platform Python packaging).
      - name: Set up Python (Windows)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python wheel (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd "${{ github.workspace }}\python"
          python -m pip install --quiet build cffi wheel
          New-Item -ItemType Directory -Force lib | Out-Null
          Copy-Item "${{ github.workspace }}\lib\shared\libhttp2client.dll" "lib\libhttp2client.dll"
          python setup.py bdist_wheel --plat-name=win_amd64 --dist-dir dist
          Get-ChildItem dist

      - name: Upload Python wheel (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-windows-latest
          path: python/dist/*.whl
          if-no-files-found: error

      - name: Upload Java JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-jar-windows-latest
          path: java/build/*.jar
          if-no-files-found: error

  # ================================================================
  # Release — publishes the compiled shared library + public headers
  # to a GitHub Release. Triggered only when a `v*` tag is pushed
  # (e.g. `v1.2.3`). Waits for all platform build jobs to succeed.
  # ================================================================
  release:
    name: release
    # Only runs on tag pushes; PRs / main pushes skip this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ build-linux, build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a GitHub Release + upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '{lib-http2client-*,nodejs-addon-*,python-binding-*,python-wheel-*,java-jar-*}'
          merge-multiple: false
          path: artifacts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Release layout — each component follows its language's package-manager
      # standard, published to GitHub Release as the distribution artifact:
      #   C library     : http2client-<ver>-all.tar.gz   (linux/ macos/ win/ subdirs)
      #   Node.js       : http2-client-nodejs-<ver>.tgz  (npm pack: prebuilds/<plat>-<arch>/
      #                   http2addon.node + runtime DLLs, load-addon.js picks by OS+arch)
      #   Python        : http2_client-<ver>-<plat>.whl  (3 platform wheels, self-contained)
      #   Java          : http2-client-java-<ver>.jar    (single cross-platform fat
      #                   JAR: classes + native/linux|macos|win — works on any OS)
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          # Strip a leading "v" from the tag so artifact names and the npm version
          # share the same bare semver (v1.0.2 -> 1.0.2).
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging standard cross-platform release assets for ${VERSION}"
          mkdir -p dist work
          command -v npm >/dev/null 2>&1 || echo "::warning:: npm not found; Node tgz will be a plain tarball"
          command -v jar >/dev/null 2>&1 || echo "::warning:: jar not found; Java repack may fail"

          # helper: map github os -> platform tag
          plat_of () { case "$1" in ubuntu-latest) echo linux;; macos-latest) echo macos;; windows-latest) echo win;; *) echo "$1";; esac; }

          # ── Stage per-platform bits ───────────────────────────────────────
          for os in ubuntu-latest macos-latest windows-latest; do
            plat="$(plat_of "$os")"
            lib="artifacts/lib-http2client-${os}"
            node="artifacts/nodejs-addon-${os}"
            py="artifacts/python-binding-${os}"
            jar="artifacts/java-jar-${os}"

            if [ ! -d "$lib" ] || [ ! -d "$node" ] || [ ! -d "$py" ] || [ ! -d "$jar" ]; then
              echo "::error:: missing release artifact for ${os} (have: $(ls artifacts))"
              exit 1
            fi

            # C library: per-platform subdir inside the all-platform tarball.
            mkdir -p "work/all/lib/${plat}" && cp -R "$lib"/. "work/all/lib/${plat}/"

            # Node addon: collect the .node + its runtime DLLs for
            # prebuilds/<plat>-<arch>/, where <arch> matches the CI runner's
            # real architecture (NOT this ubuntu release host). macos-latest is
            # arm64 (-> darwin-arm64), ubuntu/windows are x64. load-addon.js maps
            # process.platform-arch to this triplet at runtime.
            case "$plat" in macos) arch=arm64;; *) arch=x64;; esac
            pb_dir="work/node/prebuilds/${plat}-${arch}"
            mkdir -p "$pb_dir"
            # The addon lives under nodejs/build/Release/http2addon.node (Windows: build/Release/).
            addon="$(find "$node" -name 'http2addon.node' -print -quit)"
            [ -n "$addon" ] || { echo "::error:: http2addon.node not found in $node"; exit 1; }
            cp "$addon" "$pb_dir/http2addon.node"
            # Copy the shared C library (libhttp2client) next to the addon so it
            # loads at runtime without being installed system-wide. The .node's
            # RUNPATH includes $ORIGIN (see binding.gyp), so same-dir lookup works.
            # Linux:   libhttp2client.so / .so.1 / .so.1.0.0 (symlink chain).
            # macOS:   libhttp2client.dylib / .1.0.0.dylib (compatibility @rpath).
            # Windows: libhttp2client.dll + MinGW runtime DLLs.
            # upload-artifact v4 may strip symlinks, so reconstruct them here.
            soname=""
            case "$plat" in
              linux)
                soname="$(objdump -p "$pb_dir/http2addon.node" 2>/dev/null \
                  | grep -oE 'NEEDED +libhttp2client\.so\.[0-9]+' \
                  | grep -oE 'libhttp2client\.so\.[0-9]+' | head -1 || true)"
                [ -z "$soname" ] && soname="libhttp2client.so.1"
                ;;
              macos)
                soname="$(objdump -p "$pb_dir/http2addon.node" 2>/dev/null \
                  | grep -oE 'libhttp2client\.[0-9]+\.[0-9]+\.[0-9]+\.dylib' \
                  | head -1 || true)"
                [ -z "$soname" ] && soname="libhttp2client.1.dylib"
                ;;
              win)
                soname=""  # Windows: DLLs are found via same-dir search; no soname.
                ;;
            esac
            echo "Staging native lib for $plat (addon soname: ${soname:-none})"
            if [ -n "$soname" ]; then
              # Find the real library file in the lib artifact. upload-artifact
              # may have stripped symlinks, so prefer -xtype f (real files) but
              # fall back to any matching name.
              real="$(find "$lib" \( -xtype f -o -xtype l \) -name 'libhttp2client*' -print -quit)"
              if [ -n "$real" ]; then
                base="$(basename "$real")"
                # Copy the real file under its soname name (e.g. libhttp2client.so.1)
                # AND its original name. npm pack strips symlinks, so we use real
                # file copies instead of symlinks to guarantee the soname the
                # addon's NEEDED entry points to exists in the published tarball.
                cp "$real" "$pb_dir/$soname"
                # Also keep the original name so LD_LIBRARY_PATH / -l lookups work.
                [ "$base" != "$soname" ] && cp "$real" "$pb_dir/$base"
                echo "  staged $base as $soname"
              else
                echo "::warning:: no libhttp2client shared lib found in $lib for $plat"
              fi
            fi
            # Windows: also copy the MinGW runtime DLLs (libgcc, libstdc++, etc)
            # and libhttp2client.dll itself.
            for dll in "$lib"/*.dll; do
              [ -e "$dll" ] || continue
              cp "$dll" "$pb_dir/"
            done 2>/dev/null || true

            # Java: stash each platform's fat JAR for the classifier split below.
            j="$(find "$jar" -maxdepth 1 -name '*.jar' -print -quit)"
            [ -n "$j" ] || { echo "::error:: Java JAR not found under $jar"; exit 1; }
            mkdir -p work/jars && cp "$j" "work/jars/java-${plat}.jar"
            echo "Staged ${plat}"
          done

          # ── 1. C library: single multi-platform tarball ──────────────────
          tar -czf "dist/http2client-${VERSION}-all.tar.gz" -C work/all/lib .
          echo "Created dist/http2client-${VERSION}-all.tar.gz"

          # ── 2. Node.js: standard npm tarball with prebuilds/ ──────────────
          node_pkg="work/node-pkg"
          rm -rf "$node_pkg" && mkdir -p "$node_pkg"
          cp -R artifacts/nodejs-addon-ubuntu-latest/index.js \
                 artifacts/nodejs-addon-ubuntu-latest/load-addon.js \
                 artifacts/nodejs-addon-ubuntu-latest/index.d.ts \
                 "$node_pkg"/ 2>/dev/null || true
          # CRITICAL: do NOT copy package.json from the artifact. build.sh runs
          # `npm install` in the nodejs/ dir, which re-injects gypfile:true and an
          # `install: "node-gyp rebuild"` script into package.json (because
          # binding.gyp exists). Instead, extract the pristine package.json
          # straight from git HEAD so the published package has no install script
          # / gypfile. Also skip binding.gyp entirely (not needed at install time;
          # load-addon.js uses prebuilds/).
          git show HEAD:nodejs/package.json > "$node_pkg/package.json"
          cp -R work/node/prebuilds "$node_pkg"/prebuilds
          for src in artifacts/nodejs-addon-ubuntu-latest/README.md \
                     artifacts/nodejs-addon-ubuntu-latest/README.MD; do
            if [ -f "$src" ]; then
              cp "$src" "$node_pkg/README.md"
              break
            fi
          done
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            PKG_VER="${GITHUB_REF_NAME#v}"
            echo "Setting published npm version to ${PKG_VER} (from tag ${GITHUB_REF_NAME})"
            ( cd "$node_pkg" && npm pkg set version="$PKG_VER" )
          else
            echo "Not a tag push (GITHUB_REF_NAME=$GITHUB_REF_NAME); keeping version ${VERSION}"
          fi
          if command -v npm >/dev/null 2>&1; then
            ( cd "$node_pkg" && npm pack )
            mv "$node_pkg"/*.tgz "dist/http2-client-nodejs-${VERSION}.tgz"
            echo "Created dist/http2-client-nodejs-${VERSION}.tgz"
          else
            tar -czf "dist/http2-client-nodejs-${VERSION}.tgz" -C "$node_pkg" .
            echo "Created dist/http2-client-nodejs-${VERSION}.tgz (plain tarball)"
          fi

          # ── 3. Python: three platform wheels (already built per OS) ──────
          shopt -s nullglob
          for w in artifacts/python-wheel-ubuntu-latest/*.whl \
                   artifacts/python-wheel-macos-latest/*.whl \
                   artifacts/python-wheel-windows-latest/*.whl; do
            [ -e "$w" ] || continue
            cp "$w" dist/
            echo "Created dist/$(basename "$w")"
          done

          # ── 3b. Python: source distribution (sdist) ─────────────────────
          echo "Building Python sdist (source-only fallback)..."
          if command -v python3 >/dev/null 2>&1; then
            python3 -m pip install --quiet build 2>/dev/null || true
            py_src="artifacts/python-binding-ubuntu-latest"
            [ -d "$py_src" ] || py_src="artifacts/python-binding-macos-latest"
            [ -d "$py_src" ] || py_src="artifacts/python-binding-windows-latest"
            tmp_sdist="work/sdist-src"; rm -rf "$tmp_sdist"; cp -R "$py_src" "$tmp_sdist"
            # Remove any prebuilt native lib so the sdist does not carry binaries.
            rm -rf "$tmp_sdist/lib"
            ( cd "$tmp_sdist" && python3 -m build --sdist --outdir "${{ github.workspace }}/dist" )
            sd="$(ls -1 "${{ github.workspace }}/dist"/*.tar.gz 2>/dev/null | grep -v -- '-all.tar.gz' | tail -1)"
            [ -n "$sd" ] && echo "Created dist/$(basename "$sd")" || echo "::warning:: sdist build produced no tarball"
          else
            echo "::warning:: python3 unavailable; skipping Python sdist (wheels still published)"
          fi

          # ── 4. Java: single cross-platform fat JAR ──────────────────────
          echo "Merging all platforms' native libs into one fat JAR..."
          rm -rf work/jar-all && mkdir -p work/jar-all
          # Base classes/deps from any platform (they are identical bytecode).
          unzip -q -o "work/jars/java-linux.jar" -d work/jar-all
          # Lay down each platform's natives under native/<plat>/.
          for plat in linux macos win; do
            tmp="work/jar-${plat}"
            rm -rf "$tmp" && mkdir -p "$tmp/native"
            unzip -q -o "work/jars/java-${plat}.jar" -d "$tmp" 'native/*'
            found=0
            for f in "$tmp"/native/*; do
              [ -f "$f" ] || continue
              mkdir -p "work/jar-all/native/${plat}"
              cp "$f" "work/jar-all/native/${plat}/"
              found=1
            done
            if [ "$found" -eq 0 ]; then
              echo "::error:: no native libraries found in java-${plat}.jar"
              exit 1
            fi
          done
          jar cfm "dist/http2-client-java-${VERSION}.jar" \
            work/jar-all/META-INF/MANIFEST.MF -C work/jar-all .
          echo "Created dist/http2-client-java-${VERSION}.jar (cross-platform: native/linux|macos|win)"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > "checksums-${GITHUB_REF_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tgz
            dist/*.whl
            dist/*.jar
            dist/checksums-${{ github.ref_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Publish to npm registry ───────────────────────────────────────────
      - name: Publish Node.js package to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          command -v npm >/dev/null 2>&1 || { echo "::warning:: npm not found; skipping npm publish"; exit 0; }
          node_pkg="work/node-pkg"
          if [ ! -d "$node_pkg/prebuilds" ]; then
            echo "::error:: node prebuilds not staged; cannot publish"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          ( cd "$node_pkg" && npm publish --access public --ignore-scripts )
          echo "Published @gointuition/http-client to npm registry"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
