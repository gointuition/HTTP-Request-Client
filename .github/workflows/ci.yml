name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Third-party sources (BoringSSL, brotli, jansson, zstd, ...) are cloned by
      # CMake at the pinned revisions declared in CMakeLists.txt. Cache them keyed
      # on that file so bumping a pin invalidates the cache; a valid cached
      # checkout is reused as-is by clone_third_party_pinned().
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # ccache caches compiler outputs by hashing inputs, so re-running the
      # pipeline (or bumping a dependency) skips recompiling unchanged .o files
      # — including the heavy third-party libraries (BoringSSL, etc.).
      # Installed manually (no third-party action dependency) and cached via
      # actions/cache.
      - name: Install ccache
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install ccache
          else
            sudo apt-get update && sudo apt-get install -y ccache
          fi
          ccache --version
          ccache --zero-stats || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # Keyed on the third-party pins (CMakeLists.txt) so a commit that does
          # NOT touch them reuses the cached compiler outputs — including the
          # patched BoringSSL tree, whose source hashes are stable across such
          # commits and therefore ccache-friendly.
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-
            ccache-${{ runner.os }}-

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          # Same pin-based key as ccache: when third-party pins are unchanged the
          # entire build/ tree (incl. third-party .a files) is restored and Ninja
          # skips recompiling BoringSSL/brotli/zstd/etc. entirely.
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-
            build-${{ runner.os }}-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build build --parallel 4

      # Test executables validate basket JSON internally via jansson and exit
      # non-zero on failure. Logs are still captured for inspection via artifacts.
      - name: Smoke test — GET
        shell: bash
        working-directory: bin
        run: |
          set -o pipefail
          ./test_GET 2>&1 | tee test_GET.log

      - name: Smoke test — POST
        shell: bash
        working-directory: bin
        run: |
          set -o pipefail
          ./test_POST 2>&1 | tee test_POST.log

      # Surface the built artifacts for quick inspection on failures.
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: bin/*.log
          if-no-files-found: ignore

      # ================================================================
      # Language bindings (test.py / test.js / Test.java)
      # Every binding test exits non-zero on failure (sys.exit(1) /
      # process.exit(1) / System.exit(1)), so the step itself captures
      # pass/fail.  Output is additionally captured as a log artifact
      # for post-mortem inspection.
      # ================================================================

      # Python binding (cffi ABI mode — loads the shared library directly,
      # no C compiler needed).  build.sh installs cffi and runs test.py.
      # See python/README.md.
      - name: Python — run test.py
        id: py_test
        shell: bash
        run: |
          set -o pipefail
          cd "${{ github.workspace }}"
          bash python/build.sh 2>&1 | tee python_test.log
          echo "---"
          if grep -q "All tests passed" python_test.log; then
            echo "::notice:: Python test PASSED"
          fi

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log-${{ matrix.os }}
          path: python_test.log
          if-no-files-found: ignore

      # Java binding (JNI bridge; builds a fat JAR linking http2client + JNI
      # bridge, then runs Test.java from the JAR).  See java/build.sh.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java — build and run Test.java
        id: java_test
        shell: bash
        run: |
          set -o pipefail
          cd "${{ github.workspace }}/java"
          bash build.sh 2>&1 | tee "${{ github.workspace }}/java_test.log"
          echo "---"
          if grep -q "All tests passed" "${{ github.workspace }}/java_test.log"; then
            echo "::notice:: Java test PASSED"
          fi

      - name: Upload Java test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-log-${{ matrix.os }}
          path: java_test.log
          if-no-files-found: ignore

      # Node.js binding (N-API native addon via node-gyp).
      # build.sh runs npm install + build; test.js runs via node.
      # See nodejs/README.MD.
      - name: Node.js — build and run test.js
        id: node_test
        shell: bash
        run: |
          set -o pipefail
          cd "${{ github.workspace }}/nodejs"
          bash build.sh
          node test.js 2>&1 | tee "${{ github.workspace }}/nodejs_test.log"
          echo "---"
          if grep -q "All tests passed" "${{ github.workspace }}/nodejs_test.log"; then
            echo "::notice:: Node.js test PASSED"
          fi

      - name: Upload Node.js test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-test-log-${{ matrix.os }}
          path: nodejs_test.log
          if-no-files-found: ignore

      # Publish the compiled shared library + public headers so downstream
      # consumers (and the release job) can fetch them without rebuilding.
      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-http2client-${{ matrix.os }}
          path: |
            lib/shared/*
            include/*.h
          if-no-files-found: error

      # Publish language bindings built above, so the release job can bundle
      # them alongside the shared library per platform.
      - name: Upload Node.js addon
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-addon-${{ matrix.os }}
          path: nodejs
          if-no-files-found: error

      - name: Upload Python binding
        uses: actions/upload-artifact@v4
        with:
          name: python-binding-${{ matrix.os }}
          path: python
          if-no-files-found: error

      - name: Upload Java JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-jar-${{ matrix.os }}
          path: java/build/*.jar
          if-no-files-found: error

  # Windows builds use MSYS2 / MinGW-w64 (native MSVC is not supported).
  # See README.md "Windows (MSYS2 / MinGW-w64)" for the toolchain setup.
  build-and-test-windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        # All shell steps run inside the MSYS2 MINGW64 environment.
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        id: msys2_setup
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-tools-git
            unzip
            git

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-Windows-${{ hashFiles('CMakeLists.txt') }}

      # ccache caches compiler outputs by input hash, skipping recompilation of
      # unchanged objects (incl. the heavy third-party libraries). Persist the
      # cache across runs via actions/cache.
      #
      # IMPORTANT (MSYS2): ccache runs inside the MSYS2 shell, where `~` resolves
      # to /home/runner, NOT the Windows C:\Users\runner that actions/cache uses.
      # Mixing the two paths makes reads/writes land in different locations, so
      # the cache is never hit. We therefore use an explicit workspace-relative
      # path for BOTH the cache store and CCACHE_DIR so they always match.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          # Keyed on the third-party pins so an unchanged CMakeLists.txt reuses
          # the cached compiler outputs (incl. the patched BoringSSL tree).
          key: ccache-Windows-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-Windows-${{ hashFiles('CMakeLists.txt') }}-
            ccache-Windows-

      # CRITICAL: without caching build/, the restored third_party sources have no
      # matching object/library files, so Ninja recompiles BoringSSL (and every
      # other third party) from scratch every run. Caching build/ keyed on the
      # same pins lets Ninja treat the tree as up-to-date and skip third-party
      # compilation entirely when the pins are unchanged.
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-Windows-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            build-Windows-${{ hashFiles('CMakeLists.txt') }}-
            build-Windows-

      - name: Configure
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export PATH="/mingw64/bin:$PATH"
          ccache -M 1G
          ccache -z
          ccache -p | head -1
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          export PATH="/mingw64/bin:$PATH"
          cmake --build build --parallel $(nproc)
          echo "---- ccache stats ----"
          ccache -s

      - name: Smoke test — GET
        working-directory: bin
        run: |
          set -o pipefail
          ./test_GET 2>&1 | tee test_GET.log

      - name: Smoke test — POST
        working-directory: bin
        run: |
          set -o pipefail
          ./test_POST 2>&1 | tee test_POST.log

      - name: Upload C test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows-latest
          path: bin/*.log
          if-no-files-found: ignore

      # ================================================================
      # Language bindings (test.py / test.js / Test.java) — Windows
      # ================================================================

      # Python: cffi already handles Windows (http2_client.py detects the
      # platform and uses libhttp2client.dll).  build.sh installs cffi via
      # MSYS2 pip (mingw-w64-x86_64-python-pip package).
      - name: Python — run test.py (Windows)
        id: py_test_win
        shell: msys2 {0}
        run: |
          set -o pipefail
          cd "${{ github.workspace }}"
          bash python/build.sh 2>&1 | tee python_test.log
          echo "---"
          if grep -q "All tests passed" python_test.log; then
            echo "::notice:: Python test PASSED"
          fi

      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log-windows-latest
          path: python_test.log
          if-no-files-found: ignore

      # Java: build.sh already handles MSYS2 (resolves JAVA_HOME, requires
      # gcc).  setup-java provides a JDK.  Maven is downloaded inside the
      # MSYS2 step (its GITHUB_PATH entry isn't inherited by MSYS2 shell).
      # The JNI bridge is compiled with gcc (-Djni.compiler=gcc) to match
      # the MinGW-built libhttp2client.dll.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Java — build and run Test.java (Windows)
        id: java_test_win
        shell: msys2 {0}
        run: |
          set -o pipefail
          # setup-java sets JAVA_HOME as a Windows path; convert to Unix
          # form so it works inside MSYS2 regardless of path-conversion
          # settings.
          if [ -n "$JAVA_HOME" ]; then
            export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version
          # Maven: MSYS2 does not inherit GITHUB_PATH; download the binary
          # inside the MSYS2 context so mvn is on PATH.
          MAVEN_VERSION=3.9.9
          curl -fsSLO "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.zip"
          unzip -qo "apache-maven-${MAVEN_VERSION}-bin.zip" -d /tmp
          export PATH="/tmp/apache-maven-${MAVEN_VERSION}/bin:$PATH"
          mvn --version
          # NOTE: MSYS2_ARG_CONV_EXCL is set inside build.sh right before
          # the mvn clean package call (per java/README.md).  Do NOT set it
          # here — it would also disable conversion for Maven's own shell
          # launcher and break classpath resolution.
          cd "${{ github.workspace }}/java"
          bash build.sh 2>&1 | tee "${{ github.workspace }}/java_test.log"
          echo "---"
          if grep -q "All tests passed" "${{ github.workspace }}/java_test.log"; then
            echo "::notice:: Java test PASSED"
          fi

      - name: Upload Java test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-log-windows-latest
          path: java_test.log
          if-no-files-found: ignore

      # Node.js: Windows uses a split toolchain (see nodejs/README.MD
      # "Windows (MSVC + MinGW dual-toolchain)").  The C library
      # (libhttp2client.dll) is already built by MinGW above; the addon is
      # compiled with MSVC via node-gyp.  build-addon.js generates the MSVC
      # import library (http2client.lib) from the DLL using gendef (MSYS2)
      # + lib.exe (MSVC), then runs node-gyp rebuild, and finally copies
      # libhttp2client.dll + MinGW runtime DLLs next to the addon.
      #
      # We run from PowerShell (not MSYS2) so node-gyp's MSVC auto-detection
      # works out of the box (windows-latest ships VS 2022).  The MSYS2
      # mingw64\bin is prepended to PATH only to expose gendef.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache npm deps + node-gyp's downloaded Node headers so re-runs skip the
      # (slow) npm install and header fetch. Keyed on package-lock.json so a dep
      # change forces a refresh. (The native .node addon itself is rebuilt each
      # run via `node-gyp rebuild`, which is comparatively fast vs. npm install.)
      - name: Cache Node.js dependencies (Windows)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/nodejs/node_modules
            ~\AppData\Local\node-gyp\Cache
            ~\node-gyp
          key: node-deps-windows-${{ hashFiles('nodejs/package-lock.json') }}
          restore-keys: |
            node-deps-windows-

      - name: Node.js — build and run test.js (Windows)
        id: node_test_win
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Prepend MSYS2 mingw64\bin so gendef (from mingw-w64-x86_64-tools-git)
          # is discoverable; keep the rest of PATH (SystemFiles, VS, ...) intact.
          $env:PATH = "${{ steps.msys2_setup.outputs.msys2-location }}\mingw64\bin;" + $env:PATH
          Set-Location "${{ github.workspace }}\nodejs"
          # Verify gendef is reachable (the import-lib step needs it).
          where.exe gendef

          # node-gyp's PowerShell-based VS detection is broken on this runner
          # (its PowerShell spawn crashes with ERR_CHILD_PROCESS_STDIO_MAXB and
          # it mis-parses the VS 18 install as "unknown version undefined").
          # Workaround: set VCINSTALLDIR + VSCMD_VER + WindowsSDKVersion to make
          # node-gyp's non-PowerShell path (findVSFromSpecifiedLocation) succeed.
          # It needs all three: VCINSTALLDIR for the install path, VSCMD_VER for
          # the version→year mapping (17.x → 2022), WindowsSDKVersion for the SDK.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsInstall) {
            Write-Error "Visual Studio with VC tools not found via vswhere"
            exit 1
          }
          $env:VCINSTALLDIR = "$vsInstall\VC\"
          # Pretend it is VS 2022 (17.x) so node-gyp accepts the version. The
          # MSVC toolset is ABI-compatible across VS 2022/18 for our purposes.
          $env:VSCMD_VER = "17.0.0"
          # Pick the latest Windows SDK installed (node-gyp needs one to link).
          $sdkDir = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1).Name
          if ($sdkDir) { $env:WindowsSDKVersion = "$sdkDir\" }
          Write-Output "Using VS: $vsInstall"
          Write-Output "VCINSTALLDIR=$env:VCINSTALLDIR VSCMD_VER=$env:VSCMD_VER WindowsSDKVersion=$env:WindowsSDKVersion"

          # Install deps WITHOUT running the install script, then build
          # explicitly so a build failure aborts before test.js runs.
          # `npm install` is now a no-op when node_modules is restored from cache.
          npm install --ignore-scripts
          # build-addon.js: generates http2client.lib (gendef + lib.exe),
          # runs node-gyp rebuild (MSVC), copies runtime DLLs next to addon.
          npm run build
          if ($LASTEXITCODE -ne 0) { Write-Error "addon build failed"; exit 1 }
          node test.js 2>&1 | Tee-Object -FilePath "${{ github.workspace }}\nodejs_test.log"
          if ($LASTEXITCODE -ne 0) { Write-Error "test.js failed"; exit 1 }
          Write-Output "---"
          if (Select-String -Path "${{ github.workspace }}\nodejs_test.log" -Pattern "All tests passed" -Quiet) {
            Write-Output "::notice:: Node.js test PASSED"
          } else {
            Write-Error "Node.js test did not report success"
            exit 1
          }

      - name: Upload Node.js test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-test-log-windows-latest
          path: nodejs_test.log
          if-no-files-found: ignore

      # Publish the compiled shared library (libhttp2client.dll, staged next to
      # the test/Node addon) + public headers for the release job.
      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-http2client-windows-latest
          path: |
            lib/shared/*
            include/*.h
          if-no-files-found: error

      # Publish language bindings built above, so the release job can bundle
      # them alongside the shared library per platform.
      - name: Upload Node.js addon
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-addon-windows-latest
          path: nodejs
          if-no-files-found: error

      - name: Upload Python binding
        uses: actions/upload-artifact@v4
        with:
          name: python-binding-windows-latest
          path: python
          if-no-files-found: error

      - name: Upload Java JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-jar-windows-latest
          path: java/build/*.jar
          if-no-files-found: error

  # ================================================================
  # Release — publishes the compiled shared library + public headers
  # to a GitHub Release. Triggered only when a `v*` tag is pushed
  # (e.g. `v1.2.3`). Waits for all platform build jobs to succeed.
  # ================================================================
  release:
    name: release
    # Only runs on tag pushes; PRs / main pushes skip this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ build-and-test, build-and-test-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a GitHub Release + upload assets

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '{lib-http2client-*,nodejs-addon-*,python-binding-*,java-jar-*}'
          merge-multiple: false
          path: artifacts

      # Release layout:
      #   C library / Node.js / Python are published PER PLATFORM (each builds its
      #   own native bits: shared lib, .node addon, .pyd, bundled DLLs).
      #   Java is published ONCE as a cross-platform fat JAR (platform-agnostic
      #   JVM bytecode + native libs bundled inside).
      #   1. C shared library  : http2client-<ver>-<plat>.tar.gz
      #   2. Node.js binding   : http2client-nodejs-<ver>-<plat>.tar.gz
      #   3. Python binding    : http2client-python-<ver>-<plat>.tar.gz
      #   4. Java binding      : http2-client-java-<ver>.jar   (cross-platform)
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          echo "Packaging release assets for ${VERSION}"
          mkdir -p dist work

          for os in ubuntu-latest macos-latest windows-latest; do
            case "$os" in
              ubuntu-latest)  plat="linux" ;;
              macos-latest)   plat="macos" ;;
              windows-latest) plat="win" ;;
              *)              plat="$os" ;;
            esac

            lib="artifacts/lib-http2client-${os}"
            node="artifacts/nodejs-addon-${os}"
            py="artifacts/python-binding-${os}"

            if [ ! -d "$lib" ] || [ ! -d "$node" ] || [ ! -d "$py" ]; then
              echo "::error:: missing release artifact for ${os} (have: $(ls artifacts))"
              exit 1
            fi

            # ---- 1. C shared library ----
            stage="work/lib-${plat}"
            rm -rf "$stage" && mkdir -p "$stage"
            cp -R "$lib"/. "$stage"/            # shared lib + include/
            tar -czf "dist/http2client-${VERSION}-${plat}.tar.gz" -C "$stage" .
            echo "Created dist/http2client-${VERSION}-${plat}.tar.gz"

            # ---- 2. Node.js binding (platform-specific addon / DLLs) ----
            tar -czf "dist/http2client-nodejs-${VERSION}-${plat}.tar.gz" -C "$node" .
            echo "Created dist/http2client-nodejs-${VERSION}-${plat}.tar.gz"

            # ---- 3. Python binding (platform-specific .pyd / DLLs) ----
            tar -czf "dist/http2client-python-${VERSION}-${plat}.tar.gz" -C "$py" .
            echo "Created dist/http2client-python-${VERSION}-${plat}.tar.gz"
          done

          # ---- 4. Java fat JAR (cross-platform, from ubuntu build) ----
          # Resolve the single JAR via find (avoids unquoted-glob word-splitting).
          jar="$(find artifacts/java-jar-ubuntu-latest -maxdepth 1 -name '*.jar' -print -quit)"
          if [ -z "$jar" ] || [ ! -f "$jar" ]; then
            echo "::error:: Java JAR artifact not found under artifacts/java-jar-ubuntu-latest"
            exit 1
          fi
          cp "$jar" "dist/http2-client-java-${VERSION}.jar"
          echo "Created dist/http2-client-java-${VERSION}.jar"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > "checksums-${GITHUB_REF_NAME}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag is derived from the triggering ref; generate release notes
          # automatically from merged PRs/commits since the last tag.
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.jar
            dist/checksums-${{ github.ref_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

